name: PR Title Lint

# Enforces Conventional Commit formatting on pull request titles.
#
# `pull_request_target` is used on purpose: the action only reads the PR title
# and adds a label, it never checks out or executes the pull request's code.
# The workflow therefore holds a privileged token while running untrusted
# *text* only - never untrusted *code*.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-title-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
