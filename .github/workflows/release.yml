name: Release

# Build the signed Windows installer + auto-updater artifacts and attach them
# to the draft release for the pushed tag.
#
# The tag is created by Release Please (see .github/workflows/release-please.yml),
# which also opens a DRAFT GitHub Release carrying the changelog. tauri-action
# reuses that existing draft (it matches on tag name) and uploads the built
# artifacts into it, so there is exactly one release per version. A human
# publishes the draft once the assets are in place.
#
# Required repository secrets (see docs/RELEASING.md):
#   TAURI_SIGNING_PRIVATE_KEY            updater signing key (minisign, from `npx tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   password for that key (empty string if none)
#   REQUIRE_CODE_SIGNING                 "1" to fail the build instead of shipping unsigned
#   AZURE_TRUSTED_SIGNING_*  or  WINDOWS_CERT_PFX + WINDOWS_CERT_PASSWORD  or
#   SIGNTOOL_PATH + WINDOWS_CERT_THUMBPRINT   (Authenticode credentials)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_URL: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
  # The GPU acceleration pack is uploaded to the same GitHub release; the app
  # looks it up at runtime. Override for a custom CDN (docs/GPU_PACK.md).
  VITE_ACCEL_PACK_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/accel-manifest.json

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    # The production environment is the release gate:
    #   - a required reviewer must approve the deployment before this job runs;
    #   - the updater signing key and the Authenticode credentials live in the
    #     ENVIRONMENT (not at repository level), so they are only injected into
    #     this job after that approval.
    # The `staging` environment exists as the reserved non-production target
    # (no reviewer, no wait timer); the draft GitHub Release produced by this
    # workflow is the de-facto staging area until it is published.
    environment:
      name: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # No `toolchain:` input: dtolnay/rust-toolchain reads src-tauri/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frozen sidecar (backend.exe)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean backend/build_sidecar.spec

      - name: Download FFmpeg + stage external binaries
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath C:\ffmpeg-ci -Force
          $triple = "x86_64-pc-windows-msvc"
          Copy-Item dist/backend.exe "src-tauri\binaries\backend-$triple.exe" -Force
          Copy-Item C:\ffmpeg-ci\ffmpeg\bin\ffmpeg.exe "src-tauri\binaries\ffmpeg-$triple.exe" -Force
          Copy-Item C:\ffmpeg-ci\ffmpeg\bin\ffprobe.exe "src-tauri\binaries\ffprobe-$triple.exe" -Force

      - name: Build, sign and publish
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REQUIRE_CODE_SIGNING: "1"
          AZURE_TRUSTED_SIGNING_METADATA: ${{ secrets.AZURE_TRUSTED_SIGNING_METADATA }}
          AZURE_TRUSTED_SIGNING_DLIB: ${{ secrets.AZURE_TRUSTED_SIGNING_DLIB }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          SIGNTOOL_PATH: ${{ secrets.SIGNTOOL_PATH }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tafseer Clipper ${{ github.ref_name }}"
          releaseBody: "See the release notes for details."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Build GPU acceleration pack
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-accel-pack.ps1 -OutDir dist/accel -Python python

      - name: Upload GPU acceleration pack to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          # Upload by release ID rather than by tag: `gh release upload <tag>`
          # resolves the release through the "get release by tag" endpoint, which
          # does not return DRAFT releases - and the release for this tag is a
          # draft at this point.
          if (-not $env:RELEASE_ID) { throw "tauri-action did not report a releaseId." }
          $assets = @(Get-ChildItem "dist\accel\files" -File -ErrorAction SilentlyContinue)
          $assets += @(Get-Item "dist\accel\accel-manifest.json")
          foreach ($asset in $assets) {
            $name = [System.Uri]::EscapeDataString($asset.Name)
            gh api --method POST "repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets?name=$name" `
              --header "Content-Type: application/octet-stream" `
              --input $asset.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($asset.Name)" }
          }
          Write-Host "Uploaded $($assets.Count) acceleration-pack assets."

      - name: Name the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          # Release Please creates the release with the tag as its title; give it
          # the product name. The changelog body is left untouched.
          gh api --method PATCH "repos/${{ github.repository }}/releases/$env:RELEASE_ID" `
            -f "name=Tafseer Clipper ${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { Write-Warning "Could not rename the release; continuing." }
