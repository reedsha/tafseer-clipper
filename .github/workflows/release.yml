name: Release

# Build the signed Windows installer + auto-updater artifacts and attach them
# to the draft release for the pushed tag.
#
# The tag is created by Release Please (see .github/workflows/release-please.yml),
# which also opens a DRAFT GitHub Release carrying the changelog. tauri-action
# reuses that existing draft (it matches on tag name) and uploads the built
# artifacts into it, so there is exactly one release per version. A human
# publishes the draft once the assets are in place.
#
# Required repository secrets (see docs/RELEASING.md). They live in the
# `production` ENVIRONMENT, not at repository level:
#   TAURI_SIGNING_PRIVATE_KEY            updater signing key (minisign, from `npx tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   password for that key (empty string if none)
#   REQUIRE_CODE_SIGNING                 "1" to fail the build instead of shipping unsigned
#   AZURE_TRUSTED_SIGNING_*  or  WINDOWS_CERT_PFX + WINDOWS_CERT_PASSWORD  or
#   SIGNTOOL_PATH + WINDOWS_CERT_THUMBPRINT   (Authenticode credentials)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Never let two release builds race on the same draft release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # gyan.dev "essentials" FFmpeg build (GPL, includes libx264 + ffprobe).
  # Pinned to a specific version and verified against gyan.dev's published
  # SHA-256 before it is bundled into the signed installer.
  FFMPEG_URL: https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
  # The GPU acceleration pack is uploaded to the same GitHub release; the app
  # looks it up at runtime. Override for a custom CDN (docs/GPU_PACK.md).
  VITE_ACCEL_PACK_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/accel-manifest.json

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    # The production environment is the release gate:
    #   - a required reviewer must approve the deployment before this job runs;
    #   - the updater signing key and the Authenticode credentials live in the
    #     ENVIRONMENT (not at repository level), so they are only injected into
    #     this job after that approval.
    # The `staging` environment exists as the reserved non-production target
    # (no reviewer, no wait timer); the draft GitHub Release produced by this
    # workflow is the de-facto staging area until it is published.
    environment:
      name: production
    permissions:
      contents: write
      # Provenance attestation needs a GitHub-issued OIDC token.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version` input on purpose: pnpm/action-setup reads the
      # `packageManager` field from package.json, which is the single source
      # of truth for the pnpm version. Passing both makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # No `toolchain` input: dtolnay/rust-toolchain reads
      # src-tauri/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frozen sidecar (onedir)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --distpath build/sidecar backend/build_sidecar.spec
          if (-not (Test-Path "build\sidecar\backend\backend.exe")) {
            throw "PyInstaller did not produce build\sidecar\backend\backend.exe"
          }

      - name: Setup FFmpeg
        id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          ffmpeg-url: ${{ env.FFMPEG_URL }}
          ffmpeg-sha256: ${{ env.FFMPEG_SHA256 }}

      - name: Stage external binaries
        shell: pwsh
        env:
          FFMPEG_DIR: ${{ steps.ffmpeg.outputs.ffmpeg-dir }}
        run: |
          $triple = "x86_64-pc-windows-msvc"
          Copy-Item "$env:FFMPEG_DIR\ffmpeg.exe" "src-tauri\binaries\ffmpeg-$triple.exe" -Force
          Copy-Item "$env:FFMPEG_DIR\ffprobe.exe" "src-tauri\binaries\ffprobe-$triple.exe" -Force

      - name: Build, sign and publish
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Defaults to fail-closed ("1"). The `production` environment secret
          # of the same name overrides it; it is "0" only for the explicitly
          # unsigned v0.1.0-beta pre-release (docs/RELEASING.md §6).
          REQUIRE_CODE_SIGNING: ${{ secrets.REQUIRE_CODE_SIGNING || '1' }}
          AZURE_TRUSTED_SIGNING_METADATA: ${{ secrets.AZURE_TRUSTED_SIGNING_METADATA }}
          AZURE_TRUSTED_SIGNING_DLIB: ${{ secrets.AZURE_TRUSTED_SIGNING_DLIB }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          SIGNTOOL_PATH: ${{ secrets.SIGNTOOL_PATH }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tafseer Clipper ${{ github.ref_name }}"
          releaseBody: "See the release notes for details."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          # Checksums for every downloadable artifact of this release, published
          # next to the files so a user can verify what they downloaded.
          $bundle = "src-tauri\target\release\bundle\nsis"
          if (-not (Test-Path $bundle)) { $bundle = ".cargo-target\release\bundle\nsis" }
          $files = @(Get-ChildItem $bundle -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in ".exe", ".sig" })
          $files = $files | Where-Object { $_ }
          if ($files.Count -eq 0) { throw "No release artifacts found to checksum." }
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          $lines | Set-Content "SHA256SUMS.txt" -Encoding utf8
          Get-Content "SHA256SUMS.txt"

      - name: Upload SHA256SUMS.txt to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          # Release-asset uploads live on uploads.github.com (api.github.com
          # 404s this route) — see the release's own upload_url field.
          gh api --method POST "https://uploads.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets?name=SHA256SUMS.txt" `
            --header "Content-Type: application/octet-stream" --input SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload SHA256SUMS.txt" }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "src-tauri/target/release/bundle/nsis/*.exe"

      - name: Build GPU acceleration pack
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-accel-pack.ps1 -OutDir dist/accel -Python python

      - name: Upload GPU acceleration pack to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          # Upload by release ID rather than by tag: `gh release upload <tag>`
          # resolves the release through the "get release by tag" endpoint, which
          # does not return DRAFT releases - and the release for this tag is a
          # draft at this point.
          if (-not $env:RELEASE_ID) { throw "tauri-action did not report a releaseId." }
          $assets = @(Get-ChildItem "dist\accel\files" -File -ErrorAction SilentlyContinue)
          $assets += @(Get-Item "dist\accel\accel-manifest.json")
          foreach ($asset in $assets) {
            $name = [System.Uri]::EscapeDataString($asset.Name)
            gh api --method POST "https://uploads.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets?name=$name" `
              --header "Content-Type: application/octet-stream" `
              --input $asset.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($asset.Name)" }
          }
          Write-Host "Uploaded $($assets.Count) acceleration-pack assets."

      - name: Name the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          # Release Please creates the release with the tag as its title; give it
          # the product name. The changelog body is left untouched.
          gh api --method PATCH "repos/${{ github.repository }}/releases/$env:RELEASE_ID" `
            -f "name=Tafseer Clipper ${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { Write-Warning "Could not rename the release; continuing." }
