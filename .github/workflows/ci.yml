name: CI

# PR validation only. The previous `push: [main, master]` trigger duplicated
# every run for same-repo pull requests (each job re-downloads FFmpeg and the
# Python dependency tree); branch protection makes this workflow the required
# status check, so the push trigger was redundant.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the CI jobs only ever need to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # gyan.dev "essentials" FFmpeg build (GPL, includes libx264 + ffprobe).
  # Pinned to a specific version - never the moving "release" URL - and
  # verified against gyan.dev's published SHA-256 before it is used.
  FFMPEG_URL: https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba

jobs:
  frontend:
    name: Frontend (tsc, build, Playwright E2E)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Type-check and build
        run: |
          pnpm exec tsc --noEmit
          pnpm build
      - name: Setup FFmpeg
        id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          ffmpeg-url: ${{ env.FFMPEG_URL }}
          ffmpeg-sha256: ${{ env.FFMPEG_SHA256 }}
      - name: Install backend deps for E2E (no faster-whisper needed)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q fastapi==0.162.7 "uvicorn[standard]==0.54.0" pydantic==2.14.3 python-multipart==0.0.33 httpx==0.28.1 fonttools==4.68.0
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Run Playwright E2E
        shell: pwsh
        env:
          PYTHON_BIN: python
          TAFSEER_FFMPEG: ${{ steps.ffmpeg.outputs.ffmpeg-dir }}\ffmpeg.exe
          TAFSEER_FFPROBE: ${{ steps.ffmpeg.outputs.ffmpeg-dir }}\ffprobe.exe
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    name: Backend (Phase-1 E2E)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Setup FFmpeg
        id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          ffmpeg-url: ${{ env.FFMPEG_URL }}
          ffmpeg-sha256: ${{ env.FFMPEG_SHA256 }}
      - name: Run Phase-1 E2E
        shell: pwsh
        env:
          TAFSEER_FFMPEG: ${{ steps.ffmpeg.outputs.ffmpeg-dir }}\ffmpeg.exe
          TAFSEER_FFPROBE: ${{ steps.ffmpeg.outputs.ffmpeg-dir }}\ffprobe.exe
          PYTHONIOENCODING: "utf-8"
        run: python backend/test_phase1_e2e.py

  tauri-check:
    name: Tauri shell (cargo check + unit tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # No `toolchain:` input: dtolnay/rust-toolchain reads src-tauri/rust-toolchain.toml
      # (channel = "stable", components = rustfmt + clippy) so CI and local builds
      # resolve to the same toolchain.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend dist
        run: pnpm build
      - name: Setup FFmpeg
        id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          ffmpeg-url: ${{ env.FFMPEG_URL }}
          ffmpeg-sha256: ${{ env.FFMPEG_SHA256 }}
      - name: Stage external binaries (real FFmpeg, placeholder sidecar for check)
        shell: pwsh
        env:
          FFMPEG_DIR: ${{ steps.ffmpeg.outputs.ffmpeg-dir }}
        run: |
          $triple = "x86_64-pc-windows-msvc"
          Copy-Item "$env:FFMPEG_DIR\ffmpeg.exe" "src-tauri\binaries\ffmpeg-$triple.exe" -Force
          Copy-Item "$env:FFMPEG_DIR\ffprobe.exe" "src-tauri\binaries\ffprobe-$triple.exe" -Force
          # tauri-build requires every externalBin to exist; the real backend.exe
          # is produced by the release workflow, cargo check only needs a file.
          Copy-Item C:\Windows\System32\where.exe "src-tauri\binaries\backend-$triple.exe" -Force
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
      # 11 unit tests cover the GPU acceleration-pack downloader/verifier
      # (manifest parsing, SHA-256 verification, path traversal rejection).
      # They were previously never executed by any pipeline.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
