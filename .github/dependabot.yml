# Keeps the third-party dependencies and GitHub Actions up to date.
#
# Each ecosystem gets its own schedule so a noisy Python bump never delays a
# security-critical action bump.

version: 2

updates:
  # GitHub Actions - pin the SHAs the workflows actually use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Frontend - pnpm lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Tauri shell - Cargo.lock.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # FastAPI sidecar - requirements.txt.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
